app = "mizane"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[build.args]
  NEXT_PUBLIC_APP_URL = "https://YOUR-DOMAIN.ma"
  AUTH_URL = "https://YOUR-DOMAIN.ma"

[env]
  MIZANE_ENV = "production"
  NODE_ENV = "production"
  PORT = "3000"
  NEXT_PUBLIC_APP_URL = "https://YOUR-DOMAIN.ma"
  AUTH_URL = "https://YOUR-DOMAIN.ma"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  release_command = "npx prisma migrate deploy"

# Daily CV purge — Fly scheduled machine (owner):
# fly machine run --region cdg --schedule "0 3 * * *" --restart no --rm \
#   curlimages/curl:8.11.1 \
#   curl -fsS -X POST https://$NEXT_PUBLIC_APP_URL/api/cron/purge \
#     -H "Authorization: Bearer $CRON_SECRET"
